# ─────────────────────────────────────────────────────────────────────────────
# Puente de dictado por voz — servidor virtual (solo puerto 80)
#
#   sudo cp puente_web/nginx/dictado-sitio.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/dictado-sitio.conf /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d TU-DOMINIO --redirect      # añade el TLS
#   sudo nginx -t && sudo systemctl reload nginx
#
# Requiere /etc/nginx/conf.d/dictado-http.conf (la clave secreta y los map).
#
# ▸ Cambia las apariciones de "dictado.midominio.com" por tu dominio.
#
# Aquí NO hay bloque 443: el TLS y la redirección del 80 al 443 los añade
# certbot (el mismo que usas para tus otros dominios), así que no hay dos
# sitios que se puedan desincronizar. Todo lo de abajo (la barrera de la clave,
# el límite de peticiones y el reenvío al puente) sirve igual en HTTP y en
# HTTPS, porque certbot copia este bloque tal cual al del 443.
#
# El instalador puente_web/nginx/instalar_en_proxy.sh hace todo esto de una vez.
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen      80;
    listen      [::]:80;
    server_name dictado.midominio.com;

    # El puente corta en 5 MB; aquí se corta un poco antes para que el error lo
    # dé nginx sin subir el audio entero por el móvil.
    client_max_body_size 6m;

    access_log /var/log/nginx/dictado.access.log;
    error_log  /var/log/nginx/dictado.error.log;

    # Reto de Let's Encrypt ANTES del location /: así la barrera de la clave no
    # puede bloquear la renovación automática del certificado.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        # Segunda barrera (ver dictado-http.conf). El "default 0" del map hace
        # que sin la cabecera correcta todo responda 403.
        if ($clave_dictado_ok = 0) {
            return 403;
        }

        limit_req zone=dictado burst=10 nodelay;

        # El puente corre en el portátil, que tiene IP fija 192.168.1.2.
        # OJO: el 5555 (ZMQ) no se publica NUNCA: la autenticación del servidor
        # de dictado es global y no sirve como frontera.
        proxy_pass http://192.168.1.2:8000;

        # --- WebSocket (dictado en vivo) ------------------------------------
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $conexion_dictado;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Una transcripción de 60 s tarda unos segundos; y durante el dictado en
        # vivo el WebSocket se queda callado mientras hablas. Margen de sobra.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
