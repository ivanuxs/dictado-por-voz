# ─────────────────────────────────────────────────────────────────────────────
# Puente de dictado por voz — directivas de nivel http{}
#
#   sudo cp puente_web/nginx/dictado-http.conf /etc/nginx/conf.d/
#   sudo nginx -t && sudo systemctl reload nginx
#
# En Ubuntu, /etc/nginx/nginx.conf ya incluye /etc/nginx/conf.d/*.conf dentro
# del bloque http{}, así que basta copiarlo ahí. Comprueba que exista la línea:
#   nginx -T | grep -m1 'conf.d/\*\.conf'
#
# Probado contra nginx/1.24.0 (Ubuntu).
# ─────────────────────────────────────────────────────────────────────────────

# --- Segunda barrera: cabecera secreta que envía la app de Android ----------
#
# Es una barrera ADICIONAL al token del puente. El token se puede extraer de un
# APK descompilado; sin esta cabecera, nginx ni siquiera deja entrar la petición.
#
# Genera la clave y ponla aquí y en los ajustes de la app:
#     openssl rand -hex 32
#
# Los valores de los map son claves largas: `openssl rand -hex 32` da 64
# caracteres y el tamaño por defecto (64 bytes) NO alcanza. Sin esta línea,
# nginx falla al arrancar con:
#     could not build map_hash, you should increase map_hash_bucket_size: 64
map_hash_bucket_size 128;

# Si no cambias el valor de abajo, todas las peticiones devolverán 403
# (el "default 0" cierra la puerta: falla del lado seguro).
map $http_x_clave_cliente $clave_dictado_ok {
    default                        0;
    "CAMBIAR_CLAVE_DEL_PROXY"      1;
}

# --- Cabecera Connection correcta según el tipo de petición -----------------
#
# Un WebSocket necesita "Connection: upgrade"; una petición REST normal no.
# Poner "upgrade" a todo rompe las peticiones normales, así que se calcula.
map $http_upgrade $conexion_dictado {
    default  upgrade;
    ''       close;
}

# --- Límite de peticiones por IP -------------------------------------------
#
# 30 por minuto con ráfagas de 10: suficiente para dictar seguido y demasiado
# poco para un bucle descontrolado. Protege la GPU, que es única.
limit_req_zone $binary_remote_addr zone=dictado:10m rate=30r/m;
